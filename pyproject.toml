[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-reflex-engine"
version = "0.2.0"
description = "Sub-millisecond Command Safety & Reflex Decision Kernel for Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hoshi", email = "hoshi0919@outlook.com" }
]
keywords = ["agent", "security", "reflex-engine", "safety-guard", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scikit-learn>=1.3.0",
    "skl2onnx>=1.15.0",
]

[project.scripts]
lre = "reflex_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
